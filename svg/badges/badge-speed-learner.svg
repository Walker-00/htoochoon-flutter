<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="speedBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="speedGlow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="60" cy="60" r="55" fill="#1a1a24" stroke="url(#speedBadge)" stroke-width="3"/>
  <circle cx="60" cy="60" r="45" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>
  <!-- Lightning bolt -->
  <g transform="translate(60,46)" filter="url(#speedGlow)">
    <polygon points="4,-24 -10,-2 -2,-2 -4,24 10,2 2,2" fill="url(#speedBadge)"/>
    <!-- Speed lines -->
    <line x1="-20" y1="-8" x2="-30" y2="-8" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="-18" y1="2" x2="-28" y2="2" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
    <line x1="20" y1="-8" x2="30" y2="-8" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="18" y1="2" x2="28" y2="2" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  </g>
  <text x="60" y="88" text-anchor="middle" font-family="Space Grotesk" font-size="7" font-weight="700" fill="#a78bfa" letter-spacing="1">SPEED LEARNER</text>
  <!-- Sparkle -->
  <circle cx="85" cy="30" r="2" fill="#c4b5fd" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
