<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="champBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#E4B23C"/>
      <stop offset="100%" stop-color="#1AA179"/>
    </linearGradient>
    <filter id="champGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="60" cy="60" r="55" fill="#1a1a24" stroke="url(#champBadge)" stroke-width="3"/>
  <circle cx="60" cy="60" r="45" fill="none" stroke="#E4B23C" stroke-width="1" opacity="0.3"/>
  <!-- Trophy cup -->
  <g transform="translate(60,44)" filter="url(#champGlow)">
    <path d="M-16,-20 L-12,6 Q0,16 12,6 L16,-20 Z" fill="url(#champBadge)"/>
    <path d="M-16,-12 Q-28,-10 -26,0 Q-24,6 -14,4" fill="none" stroke="#E4B23C" stroke-width="3" stroke-linecap="round"/>
    <path d="M16,-12 Q28,-10 26,0 Q24,6 14,4" fill="none" stroke="#1AA179" stroke-width="3" stroke-linecap="round"/>
    <rect x="-4" y="6" width="8" height="10" rx="1" fill="#92400E"/>
    <rect x="-12" y="15" width="24" height="6" rx="3" fill="#92400E"/>
    <!-- Crown on trophy -->
    <path d="M-10,-24 L-6,-32 L0,-26 L6,-32 L10,-24 Z" fill="#fbbf24"/>
    <circle cx="0" cy="-32" r="2" fill="#fbbf24"/>
  </g>
  <!-- Confetti around -->
  <rect x="25" y="30" width="4" height="4" rx="1" fill="#c3f53c" opacity="0.5" transform="rotate(20 27 32)"/>
  <rect x="88" y="35" width="3" height="3" rx="1" fill="#ff6b6b" opacity="0.4" transform="rotate(-15 89 36)"/>
  <circle cx="30" cy="75" r="2" fill="#38bdf8" opacity="0.4"/>
  <circle cx="90" cy="70" r="2" fill="#fbbf24" opacity="0.5"/>
  <text x="60" y="90" text-anchor="middle" font-family="Space Grotesk" font-size="10" font-weight="800" fill="#E4B23C">CHAMPION</text>
</svg>
