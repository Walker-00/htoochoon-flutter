<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wizardBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c3f53c"/>
      <stop offset="100%" stop-color="#1AA179"/>
    </linearGradient>
    <filter id="wizGlow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="60" cy="60" r="55" fill="#1a1a24" stroke="url(#wizardBadge)" stroke-width="3"/>
  <circle cx="60" cy="60" r="45" fill="none" stroke="#c3f53c" stroke-width="1" opacity="0.3"/>
  <!-- Chart bars icon -->
  <g transform="translate(60,50)" filter="url(#wizGlow)">
    <rect x="-22" y="-5" width="10" height="25" rx="3" fill="#c3f53c" opacity="0.6"/>
    <rect x="-8" y="-15" width="10" height="35" rx="3" fill="#c3f53c" opacity="0.8"/>
    <rect x="6" y="-22" width="10" height="42" rx="3" fill="#c3f53c"/>
    <!-- Wizard hat tip -->
    <polygon points="0,-28 5,-18 -5,-18" fill="#E4B23C"/>
    <circle cx="0" cy="-28" r="2" fill="#E4B23C">
      <animate attributeName="r" values="2;3;2" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="60" y="88" text-anchor="middle" font-family="Space Grotesk" font-size="7" font-weight="700" fill="#c3f53c" letter-spacing="1">DATA WIZARD</text>
  <!-- Sparkles -->
  <path d="M88,30 l2,-5 2,5 5,2 -5,2 -2,5 -2,-5 -5,-2z" fill="#c3f53c" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </path>
</svg>
