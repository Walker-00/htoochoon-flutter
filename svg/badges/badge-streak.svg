<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fireBadge" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="fireGlow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="60" cy="60" r="55" fill="#1a1a24" stroke="#fbbf24" stroke-width="3"/>
  <circle cx="60" cy="60" r="45" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.3"/>
  <!-- Fire icon -->
  <g transform="translate(60,48)" filter="url(#fireGlow)">
    <path d="M0,-28 C8,-20 16,-10 16,4 C16,14 8,22 0,22 C-8,22 -16,14 -16,4 C-16,-10 -8,-20 0,-28 Z" fill="url(#fireBadge)"/>
    <path d="M0,-10 C4,-6 8,0 8,6 C8,10 4,14 0,14 C-4,14 -8,10 -8,6 C-8,0 -4,-6 0,-10 Z" fill="#fef3c7" opacity="0.7"/>
  </g>
  <!-- 7 text -->
  <text x="60" y="88" text-anchor="middle" font-family="Space Grotesk" font-size="10" font-weight="800" fill="#fbbf24">7-DAY STREAK</text>
  <!-- Sparks -->
  <circle cx="40" cy="35" r="2" fill="#fde68a" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="82" cy="40" r="1.5" fill="#fbbf24" opacity="0.5"/>
</svg>
