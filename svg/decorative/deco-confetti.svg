<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Confetti/particle burst -->
  <g>
    <!-- Lime pieces -->
    <rect x="90" y="20" width="8" height="8" rx="2" fill="#c3f53c" transform="rotate(25 94 24)"/>
    <rect x="140" y="50" width="6" height="6" rx="1" fill="#c3f53c" transform="rotate(-15 143 53)"/>
    <rect x="50" y="70" width="7" height="7" rx="2" fill="#c3f53c" transform="rotate(40 53 73)"/>
    <!-- Coral pieces -->
    <rect x="160" y="80" width="6" height="6" rx="1" fill="#ff6b6b" transform="rotate(10 163 83)"/>
    <rect x="30" y="120" width="5" height="5" rx="1" fill="#ff6b6b" transform="rotate(-30 32 122)"/>
    <!-- Sky pieces -->
    <circle cx="120" cy="40" r="4" fill="#38bdf8"/>
    <circle cx="70" cy="100" r="3" fill="#38bdf8"/>
    <!-- Amber pieces -->
    <polygon points="170,120 173,114 176,120" fill="#fbbf24"/>
    <polygon points="40,60 43,54 46,60" fill="#fbbf24"/>
    <!-- Violet pieces -->
    <rect x="100" y="130" width="5" height="5" rx="2.5" fill="#a78bfa"/>
    <rect x="150" y="150" width="4" height="4" rx="2" fill="#a78bfa"/>
    <!-- Stars -->
    <polygon points="60,30 62,26 64,30 68,30 65,33 66,37 62,35 58,37 59,33 56,30" fill="#E4B23C" opacity="0.7"/>
    <polygon points="130,100 132,96 134,100 138,100 135,103 136,107 132,105 128,107 129,103 126,100" fill="#c3f53c" opacity="0.6"/>
    <!-- Circles -->
    <circle cx="80" cy="150" r="3" fill="#1AA179" opacity="0.5"/>
    <circle cx="160" y="40" r="2" fill="#E4B23C" opacity="0.6"/>
  </g>
</svg>
