<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Repeating pattern tile -->
  <defs>
    <pattern id="patternTile" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <!-- Diamond -->
      <polygon points="25,5 35,25 25,45 15,25" fill="none" stroke="#c3f53c" stroke-width="0.8" opacity="0.12"/>
      <!-- Corner dots -->
      <circle cx="0" cy="0" r="2" fill="#c3f53c" opacity="0.1"/>
      <circle cx="50" cy="0" r="2" fill="#1AA179" opacity="0.08"/>
      <circle cx="0" cy="50" r="2" fill="#1AA179" opacity="0.08"/>
      <circle cx="50" cy="50" r="2" fill="#E4B23C" opacity="0.06"/>
      <!-- Center dot -->
      <circle cx="25" cy="25" r="1" fill="#c3f53c" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#patternTile)"/>
</svg>
