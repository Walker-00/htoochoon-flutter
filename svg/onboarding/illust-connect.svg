<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c3f53c"/>
      <stop offset="100%" stop-color="#8ab52a"/>
    </linearGradient>
  </defs>

  <!-- Background decorative -->
  <circle cx="70" cy="80" r="40" fill="#c3f53c" opacity="0.06"/>
  <circle cx="350" cy="120" r="50" fill="#1AA179" opacity="0.05"/>
  <circle cx="330" cy="350" r="35" fill="#E4B23C" opacity="0.08"/>

  <!-- Connection lines (network) -->
  <g stroke="#c3f53c" stroke-width="1" opacity="0.15">
    <line x1="100" y1="100" x2="200" y2="160"/>
    <line x1="200" y1="160" x2="300" y2="100"/>
    <line x1="200" y1="160" x2="150" y2="280"/>
    <line x1="200" y1="160" x2="300" y2="260"/>
    <line x1="300" y1="100" x2="350" y2="180"/>
    <line x1="100" y1="100" x2="80" y2="200"/>
  </g>

  <!-- Network nodes -->
  <g>
    <circle cx="100" cy="100" r="12" fill="#0B6E74" stroke="#c3f53c" stroke-width="2">
      <animate attributeName="r" values="12;14;12" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="160" r="16" fill="#c3f53c" stroke="#8ab52a" stroke-width="2">
      <animate attributeName="r" values="16;18;16" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="100" r="10" fill="#1AA179" stroke="#c3f53c" stroke-width="1.5"/>
    <circle cx="150" cy="280" r="8" fill="#E4B23C" stroke="#f0c94e" stroke-width="1.5"/>
    <circle cx="300" cy="260" r="10" fill="#0B6E74" stroke="#c3f53c" stroke-width="1.5"/>
    <circle cx="350" cy="180" r="7" fill="#1AA179"/>
    <circle cx="80" cy="200" r="6" fill="#E4B23C"/>
  </g>

  <!-- Central device — tablet/phone -->
  <g transform="translate(200,220)">
    <!-- Device body -->
    <rect x="-60" y="-70" width="120" height="140" rx="16" fill="url(#screenGrad)" stroke="#333" stroke-width="2"/>
    <!-- Screen content -->
    <rect x="-50" y="-60" width="100" height="120" rx="8" fill="#111118"/>
    <!-- Mini dashboard mockup -->
    <!-- Header bar -->
    <rect x="-45" y="-55" width="90" height="12" rx="4" fill="#c3f53c" opacity="0.15"/>
    <rect x="-40" y="-52" width="30" height="4" rx="2" fill="#c3f53c" opacity="0.4"/>
    <!-- Stat cards -->
    <rect x="-45" y="-38" width="40" height="25" rx="6" fill="#1a1a24" stroke="#333" stroke-width="0.5"/>
    <rect x="-40" y="-34" width="15" height="4" rx="2" fill="#c3f53c" opacity="0.5"/>
    <rect x="-40" y="-27" width="25" height="6" rx="2" fill="#f0f0f5" opacity="0.3"/>
    
    <rect x="0" y="-38" width="40" height="25" rx="6" fill="#1a1a24" stroke="#333" stroke-width="0.5"/>
    <rect x="5" y="-34" width="12" height="4" rx="2" fill="#E4B23C" opacity="0.5"/>
    <rect x="5" y="-27" width="20" height="6" rx="2" fill="#f0f0f5" opacity="0.3"/>
    
    <!-- Chart bars -->
    <rect x="-45" y="-8" width="90" height="30" rx="6" fill="#1a1a24" stroke="#333" stroke-width="0.5"/>
    <rect x="-38" y="8" width="8" height="14" rx="2" fill="#c3f53c" opacity="0.6"/>
    <rect x="-26" y="4" width="8" height="18" rx="2" fill="#c3f53c" opacity="0.7"/>
    <rect x="-14" y="0" width="8" height="22" rx="2" fill="#c3f53c" opacity="0.8"/>
    <rect x="-2" y="6" width="8" height="16" rx="2" fill="#c3f53c" opacity="0.6"/>
    <rect x="10" y="-2" width="8" height="24" rx="2" fill="#c3f53c"/>
    
    <!-- List items -->
    <rect x="-45" y="26" width="90" height="10" rx="4" fill="#1a1a24"/>
    <rect x="-40" y="29" width="40" height="4" rx="2" fill="#f0f0f5" opacity="0.2"/>
    <rect x="-45" y="40" width="90" height="10" rx="4" fill="#1a1a24"/>
    <rect x="-40" y="43" width="35" height="4" rx="2" fill="#f0f0f5" opacity="0.15"/>
  </g>

  <!-- Floating device outlines -->
  <g opacity="0.2" stroke="#c3f53c" stroke-width="1.5" fill="none">
    <rect x="60" y="140" width="40" height="70" rx="8"/>
    <rect x="310" y="160" width="35" height="60" rx="6"/>
  </g>

  <!-- Sparkles -->
  <g fill="#c3f53c">
    <path d="M160,110 l2,-6 2,6 6,2 -6,2 -2,6 -2,-6 -6,-2z" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M260,140 l2,-5 2,5 5,2 -5,2 -2,5 -2,-5 -5,-2z" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Title -->
  <text x="200" y="345" text-anchor="middle" font-family="Space Grotesk" font-size="26" font-weight="700" fill="#f0f0f5">
    Everything in One Place
  </text>
  <text x="200" y="372" text-anchor="middle" font-family="Nunito" font-size="13" fill="#8b8b9e">
    Classes, chats, and AI insights 🎯
  </text>
</svg>
