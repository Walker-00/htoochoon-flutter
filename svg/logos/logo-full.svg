<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@800&amp;display=swap')</style>
  </defs>
  <rect width="512" height="512" rx="100" fill="#0b0b0f"/>
  <!-- Peacock head + wordmark layout -->
  <g transform="translate(256,200)">
    <!-- Body/neck -->
    <path d="M-12,55 C-12,38 -20,22 -16,6 C-12,-6 -4,-14 5,-18 C14,-22 22,-18 26,-10 C30,-2 30,10 26,22 C24,28 19,33 14,37 L14,65 L-12,65 Z" fill="#0B6E74"/>
    <!-- Head -->
    <circle cx="7" cy="-14" r="26" fill="#0B6E74"/>
    <!-- Cheek highlight -->
    <circle cx="16" cy="-7" r="10" fill="#1AA179" opacity="0.35"/>
    <!-- Eye white -->
    <ellipse cx="12" cy="-18" rx="8" ry="9" fill="white"/>
    <!-- Pupil -->
    <circle cx="14" cy="-17" r="5.5" fill="#0A2540"/>
    <!-- Shine -->
    <circle cx="16" cy="-19" r="2.2" fill="white"/>
    <!-- Eyelash -->
    <path d="M6,-26 Q10,-29 13,-27" fill="none" stroke="#0A2540" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Beak -->
    <path d="M28,-12 Q36,-9 34,-4 Q30,-1 25,-4 Z" fill="#E4B23C"/>
    <path d="M27,-8 Q30,-6.5 32,-6" fill="none" stroke="#92400E" stroke-width="0.8" stroke-linecap="round" opacity="0.35"/>
    <!-- Blush -->
    <circle cx="20" cy="-5" r="4.5" fill="#fb7185" opacity="0.22"/>
    <!-- Crest feathers -->
    <g transform="translate(0,-38)">
      <ellipse cx="0" cy="-15" rx="5" ry="15" fill="#c3f53c"/>
      <circle cx="0" cy="-24" r="4.2" fill="#E4B23C"/>
      <circle cx="0" cy="-24" r="2.2" fill="#0A2540"/>
    </g>
    <g transform="translate(-14,-33) rotate(-18)">
      <ellipse cx="0" cy="-12" rx="4.2" ry="12" fill="#1AA179"/>
      <circle cx="0" cy="-19" r="3.5" fill="#E4B23C"/>
      <circle cx="0" cy="-19" r="1.8" fill="#0A2540"/>
    </g>
    <g transform="translate(14,-33) rotate(18)">
      <ellipse cx="0" cy="-12" rx="4.2" ry="12" fill="#1AA179"/>
      <circle cx="0" cy="-19" r="3.5" fill="#E4B23C"/>
      <circle cx="0" cy="-19" r="1.8" fill="#0A2540"/>
    </g>
    <g transform="translate(-24,-27) rotate(-30)">
      <ellipse cx="0" cy="-9" rx="3" ry="9" fill="#c3f53c" opacity="0.55"/>
      <circle cx="0" cy="-14" r="2.8" fill="#E4B23C" opacity="0.65"/>
    </g>
    <g transform="translate(24,-27) rotate(30)">
      <ellipse cx="0" cy="-9" rx="3" ry="9" fill="#c3f53c" opacity="0.55"/>
      <circle cx="0" cy="-14" r="2.8" fill="#E4B23C" opacity="0.65"/>
    </g>
  </g>
  <!-- Wordmark -->
  <text x="256" y="320" text-anchor="middle" font-family="Nunito, sans-serif" font-size="42" font-weight="800" fill="#f0f0f5" letter-spacing="-0.5">Htoo Choon</text>
  <text x="256" y="348" text-anchor="middle" font-family="Nunito, sans-serif" font-size="13" font-weight="600" fill="#8b8b9e" letter-spacing="3">LEARN · GROW · EXCEL</text>
</svg>
