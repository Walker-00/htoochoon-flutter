<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Empty State: Error / Something Went Wrong -->
  <circle cx="70" cy="60" r="30" fill="#ff6b6b" opacity="0.06"/>
  <circle cx="340" cy="240" r="40" fill="#fbbf24" opacity="0.05"/>

  <g transform="translate(200,130)">
    <!-- Broken gear -->
    <g stroke="#ff6b6b" stroke-width="3" fill="none" opacity="0.8">
      <!-- Gear teeth -->
      <path d="M0,-45 L8,-38 L8,-30 M0,-45 L-8,-38 L-8,-30"/>
      <path d="M45,0 L38,8 L30,8 M45,0 L38,-8 L30,-8"/>
      <path d="M0,45 L8,38 L8,30 M0,45 L-8,38 L-8,30"/>
      <path d="M-45,0 L-38,8 L-30,8 M-45,0 L-38,-8 L-30,-8"/>
      <path d="M32,-32 L26,-26 L20,-28 M32,-32 L28,-26 L30,-20"/>
      <path d="M32,32 L26,26 L28,20 M32,32 L30,26 L20,28"/>
      <path d="M-32,32 L-26,26 L-20,28 M-32,32 L-28,20 L-20,26"/>
      <path d="M-32,-32 L-26,-26 L-28,-20 M-32,-32 L-20,-26 L-26,-20"/>
    </g>
    <!-- Gear body -->
    <circle cx="0" cy="0" r="25" fill="#1a1a24" stroke="#ff6b6b" stroke-width="3" opacity="0.7"/>
    <!-- Crack -->
    <path d="M-8,-20 L2,-5 L-5,5 L5,20" fill="none" stroke="#ff6b6b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="10" fill="#0a0a0f" stroke="#ff6b6b" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Warning triangle -->
  <g transform="translate(200,220)" opacity="0.4">
    <polygon points="0,-15 15,12 -15,12" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="0" y="8" text-anchor="middle" font-family="Space Grotesk" font-size="14" font-weight="700" fill="#fbbf24">!</text>
  </g>

  <!-- Floating particles -->
  <circle cx="110" cy="90" r="3" fill="#ff6b6b" opacity="0.3">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="100" r="4" fill="#fbbf24" opacity="0.25"/>
</svg>
